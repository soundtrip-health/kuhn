services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kuhn
      POSTGRES_USER: kuhn
      POSTGRES_PASSWORD: kuhn_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuhn"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
